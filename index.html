<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanna hang out?</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cormorant Garamond', serif; background-color: #ffffff; color: #000000; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }
        .container { width: 100%; max-width: 600px; padding: 40px 20px; text-align: center; position: relative; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .screen.active { display: flex; }
        h1 { font-size: 2.5rem; font-weight: 400; margin-bottom: 40px; line-height: 1.2; }
        .button-group { position: relative; display: flex; gap: 20px; justify-content: center; align-items: center; width: 100%; min-height: 150px; }
        button, .btn-submit { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; padding: 12px 35px; cursor: pointer; border-radius: 0px !important; transition: background-color 0.2s ease; white-space: nowrap; }
        .btn-yes, .btn-submit { background-color: #000000; color: #ffffff; border: 2px solid #ffffff; outline: 1px solid #000000; }
        .btn-yes:hover, .btn-submit:hover { background-color: #d3d3d3 !important; color: #ffffff !important; }
        .btn-no { background-color: #ffffff; color: #000000; border: 2px solid #000000; position: relative; z-index: 10; }
        .btn-no:hover { background-color: #d3d3d3 !important; color: #000000 !important; }
        .btn-no.moving { position: fixed; z-index: 9999; transition: none; }
        .selection-section { width: 100%; margin-bottom: 30px; text-align: left; }
        .section-title { font-size: 1.4rem; margin-bottom: 10px; text-transform: lowercase; font-style: italic; border-bottom: 1px solid #000000; padding-bottom: 5px; }
        .calendar-container { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 15px; background: #ffffff; padding: 10px; border: 1px solid #000000; }
        .calendar-header { grid-column: span 7; text-align: center; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; }
        .day-name { text-align: center; font-weight: 600; font-size: 0.9rem; padding-bottom: 5px; }
        .calendar-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #eaeaea; cursor: pointer; font-size: 1rem; }
        .calendar-day.empty { border: none; cursor: default; }
        .calendar-day.disabled { color: #ccc; cursor: not-allowed; text-decoration: line-through; }
        .calendar-day.selected { background-color: #000000 !important; color: #ffffff !important; }
        .calendar-day:not(.empty):not(.disabled):hover { background-color: #e0e0e0; }
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .time-slot { border: 1px solid #000000; padding: 10px; text-align: center; cursor: pointer; background: #ffffff; }
        .time-slot.selected { background-color: #000000 !important; color: #ffffff !important; }
        .time-slot:hover { background-color: #e0e0e0; }
        textarea { width: 100%; height: 120px; border: 1px solid #000000; padding: 15px; font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; resize: none; outline: none; margin-bottom: 30px; }
        .hidden-inputs { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <form id="inviteForm" action="https://formspree.io/forms/xwvzwybn/submissions" method="POST">
            <div class="hidden-inputs">
                <input type="text" id="selectedDate" name="Chosen Date" required>
                <input type="text" id="selectedTime" name="Chosen Time" required>
                <input type="number" id="yesClickCount" name="Yes Clicked Total" value="0">
                <input type="number" id="noClickCount" name="No Clicked Total" value="0">
                <input type="number" id="noHoverCount" name="No Evaded Hover Total" value="0">
                <input type="text" id="timeOnSite" name="Total Duration On Site" value="0s">
                <input type="text" id="clickTimestamps" name="Action Timestamps Logs" value="">
            </div>
            <div id="screen1" class="screen active">
                <h1>wanna hang out sometime soon?</h1>
                <div class="button-group" id="mainButtonGroup">
                    <button type="button" class="btn-yes" id="yesBtn">yes</button>
                    <button type="button" class="btn-no" id="noBtn">no</button>
                </div>
            </div>
            <div id="screen2" class="screen">
                <h1>select date and time</h1>
                <div class="selection-section">
                    <div class="section-title">choose date</div>
                    <div id="calendar" class="calendar-container"></div>
                </div>
                <div class="selection-section">
                    <div class="section-title">choose time</div>
                    <div class="time-grid">
                        <div class="time-slot" data-time="Morning (10:00 AM)">Morning (10:00 AM)</div>
                        <div class="time-slot" data-time="Afternoon (2:00 PM)">Afternoon (2:00 PM)</div>
                        <div class="time-slot" data-time="Evening (6:00 PM)">Evening (6:00 PM)</div>
                        <div class="time-slot" data-time="Night (8:30 PM)">Night (8:30 PM)</div>
                    </div>
                </div>
                <button type="button" class="btn-submit" id="dateSubmitBtn" style="margin-top: 20px;">next</button>
            </div>
            <div id="screen3" class="screen">
                <h1>leave a message or a note if u want :)</h1>
                <textarea name="Personal Note" placeholder="Type something here..."></textarea>
                <button type="submit" class="btn-submit">submit</button>
            </div>
        </form>
    </div>
    <script>
        const startTime = Date.now();
        let counts = { yes: 0, no: 0, noHover: 0 };
        let logs = [];
        function logEvent(action) {
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            logs.push(`[${elapsed}s] ${action}`);
            document.getElementById('clickTimestamps').value = logs.join(' | ');
            document.getElementById('timeOnSite').value = `${elapsed}s`;
        }
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        let isSureState = false;
        noBtn.addEventListener('click', () => {
            counts.no++;
            document.getElementById('noClickCount').value = counts.no;
            logEvent("Clicked No");
            if (!isSureState) {
                noBtn.textContent = "are you sure?";
                isSureState = true;
                noBtn.classList.add('moving');
                positionNoButtonRandomly();
            }
        });
        ['mouseenter', 'touchstart'].forEach(evtType => {
            noBtn.addEventListener(evtType, () => {
                if (!isSureState) return;
                counts.noHover++;
                document.getElementById('noHoverCount').value = counts.noHover;
                logEvent("No button evaded mouse");
                positionNoButtonRandomly();
            });
        });
        function positionNoButtonRandomly() {
            const padding = 20;
            const yesRect = yesBtn.getBoundingClientRect();
            let randomX, randomY;
            let overlaps = true;
            let safetyCounter = 0;
            while (overlaps && safetyCounter < 100) {
                randomX = padding + Math.random() * (window.innerWidth - noBtn.offsetWidth - padding * 2);
                randomY = padding + Math.random() * (window.innerHeight - noBtn.offsetHeight - padding * 2);
                const noLeft = randomX;
                const noRight = randomX + noBtn.offsetWidth;
                const noTop = randomY;
                const noBottom = randomY + noBtn.offsetHeight;
                const intersectX = !(noRight < yesRect.left || noLeft > yesRect.right);
                const intersectY = !(noBottom < yesRect.top || noTop > yesRect.bottom);
                overlaps = intersectX && intersectY;
                safetyCounter++;
            }
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }
        yesBtn.addEventListener('click', () => {
            counts.yes++;
            document.getElementById('yesClickCount').value = counts.yes;
            logEvent("Clicked Yes");
            noBtn.classList.remove('moving');
            noBtn.style.position = 'relative';
            noBtn.style.left = 'auto';
            noBtn.style.top = 'auto';
            switchScreen('screen1', 'screen2');
        });
        function switchScreen(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            document.getElementById(toId).classList.add('active');
            if(toId === 'screen2') { renderThreeMonthCalendar(); }
        }
        let selectedDateVal = "";
        let selectedTimeVal = "";
        function renderThreeMonthCalendar() {
            const container = document.getElementById('calendar');
            container.innerHTML = '';
            const today = new Date();
            const daysOfWeek = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
            daysOfWeek.forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.textContent = d;
                container.appendChild(el);
            });
            for (let i = 0; i < 90; i++) {const targetDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);if (i === 0 || targetDate.getDate() === 1) {const monthHeader = document.createElement('div');monthHeader.className = 'calendar-header';monthHeader.textContent = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' }).toLowerCase();container.appendChild(monthHeader);const startDayOffset = targetDate.getDay();for(let x = 0; x < startDayOffset; x++) {const spacer = document.createElement('div');spacer.className = 'calendar-day empty';container.appendChild(spacer);}}const dayCell = document.createElement('div');dayCell.className = 'calendar-day';dayCell.textContent = targetDate.getDate();const dateStringString = targetDate.toISOString().split('T')[0];dayCell.dataset.date = dateStringString;dayCell.addEventListener('click', () => {document.querySelectorAll('.calendar-day').forEach(c => c.classList.remove('selected'));dayCell.classList.add('selected');selectedDateVal = dateStringString;document.getElementById('selectedDate').value = dateStringString;logEvent(Selected Date: ${dateStringString});});container.appendChild(dayCell);}}document.querySelectorAll('.time-slot').forEach(slot => {slot.addEventListener('click', () => {document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));slot.classList.add('selected');selectedTimeVal = slot.dataset.time;document.getElementById('selectedTime').value = selectedTimeVal;logEvent(Selected Time: ${selectedTimeVal});});});document.getElementById('dateSubmitBtn').addEventListener('click', () => {if (!selectedDateVal || !selectedTimeVal) {alert("Please select both a date and a time slot before continuing.");return;}switchScreen('screen2', 'screen3');});document.getElementById('inviteForm').addEventListener('submit', () => {const finalElapsed = ((Date.now() - startTime) / 1000).toFixed(1);document.getElementById('timeOnSite').value = ${finalElapsed}s;});
